name: NEXORA Playwright Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Chromium Regression
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nexora"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/nexora
      JWT_SECRET_KEY: nexora-ci-test-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7

    steps:
      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # PYTHON / FASTAPI
      # ---------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------
      # POSTGRESQL
      # ---------------------------------------------------------

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready \
            -h 127.0.0.1 \
            -p 5432 \
            -U postgres \
            -d nexora
          do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      # ---------------------------------------------------------
      # DATABASE MIGRATIONS
      # ---------------------------------------------------------

      - name: Run NEXORA database migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -e

          psql \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d nexora \
            -f database/migrations/001_create_security_tables.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d nexora \
            -f database/migrations/002_create_supplier_tables.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d nexora \
            -f database/migrations/003_create_catalogue_tables.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d nexora \
            -f database/migrations/004_create_requisition_tables.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d nexora \
            -f database/migrations/005_create_purchase_order_tables.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d nexora \
            -f database/migrations/006_create_workflow_tables.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d nexora \
            -f database/migrations/007_seed_reference_data.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d nexora \
            -f database/migrations/008_create_inventory_tables.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d nexora \
            -f database/migrations/009_create_warehouse_tables.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d nexora \
            -f database/migrations/010_seed_warehouse_reference_data.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d nexora \
            -f database/migrations/011_tax_currency_master.sql

          psql \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d nexora \
            -f database/migrations/011_phase1_business_rules.sql

      # ---------------------------------------------------------
      # ADMIN TEST USER
      # ---------------------------------------------------------

      - name: Create NEXORA admin user
        working-directory: backend
        run: |
          python create_admin.py

      # ---------------------------------------------------------
      # FASTAPI
      # ---------------------------------------------------------

      - name: Start FastAPI backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app \
            --host 0.0.0.0 \
            --port 8001 \
            > ../backend.log 2>&1 &

      - name: Wait for FastAPI
        run: |
          for attempt in {1..30}
          do
            if curl --fail --silent http://127.0.0.1:8001/health
            then
              echo
              echo "NEXORA backend is ready."
              exit 0
            fi

            echo "Waiting for FastAPI... attempt ${attempt}/30"
            sleep 2
          done

          echo "FastAPI failed to start."
          cat backend.log || true
          exit 1

      # ---------------------------------------------------------
      # FRONTEND
      # ---------------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start Vite frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 \
            > ../frontend.log 2>&1 &

      - name: Wait for frontend
        run: |
          for attempt in {1..30}
          do
            if curl --fail --silent http://127.0.0.1:5173 > /dev/null
            then
              echo "NEXORA frontend is ready."
              exit 0
            fi

            echo "Waiting for Vite... attempt ${attempt}/30"
            sleep 2
          done

          echo "Frontend failed to start."
          cat frontend.log || true
          exit 1

      # ---------------------------------------------------------
      # PLAYWRIGHT
      # ---------------------------------------------------------

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Install Chromium
        working-directory: automation
        run: |
          npx playwright install --with-deps chromium

      - name: Run NEXORA Chromium regression
        working-directory: automation
        env:
          BASE_URL: http://127.0.0.1:5173
          NEXORA_ADMIN_PASSWORD: ${{ secrets.NEXORA_ADMIN_PASSWORD }}
        run: |
          npx playwright test --project=chromium

      # ---------------------------------------------------------
      # DIAGNOSTIC LOGS
      # ---------------------------------------------------------

      - name: Show backend log on failure
        if: failure()
        run: |
          echo "========== FASTAPI LOG =========="
          cat backend.log || true

      - name: Show frontend log on failure
        if: failure()
        run: |
          echo "========== VITE LOG =========="
          cat frontend.log || true

      # ---------------------------------------------------------
      # TEST ARTIFACTS
      # ---------------------------------------------------------

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: automation/test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload application logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-application-logs
          path: |
            backend.log
            frontend.log
          retention-days: 14
          if-no-files-found: ignore