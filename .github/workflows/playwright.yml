name: NEXORA Playwright Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  playwright:
    name: Chromium Regression
    runs-on: ubuntu-latest

    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d nexora"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/nexora

      JWT_SECRET_KEY: nexora-ci-test-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      PYTHONUNBUFFERED: 1

    steps:
      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON / BACKEND
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # WAIT FOR POSTGRESQL
      # ======================================================

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."

          for i in {1..30}; do
            if pg_isready \
              -h 127.0.0.1 \
              -p 5432 \
              -U postgres \
              -d nexora
            then
              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "PostgreSQL not ready yet..."
            sleep 2
          done

          echo "PostgreSQL failed to start."
          exit 1

      # ======================================================
      # DATABASE SCHEMA
      # ======================================================
      #
      # IMPORTANT:
      #
      # We intentionally DO NOT run the old table-creation SQL
      # migrations here.
      #
      # CI receives a fresh PostgreSQL database. The database
      # structure is therefore generated from the CURRENT
      # SQLAlchemy models.
      #
      # This prevents model/migration schema drift.
      # ======================================================

      - name: Initialize NEXORA database schema
        working-directory: backend
        run: |
          python init_ci_database.py

      # ======================================================
      # CREATE ADMIN USER
      # ======================================================

      - name: Create NEXORA admin user
        working-directory: backend
        env:
          NEXORA_ADMIN_PASSWORD: ${{ secrets.NEXORA_ADMIN_PASSWORD }}
        run: |
          if [ -z "$NEXORA_ADMIN_PASSWORD" ]; then
            echo "NEXORA_ADMIN_PASSWORD secret is not configured."
            exit 1
          fi

          python create_admin.py

      # ======================================================
      # START FASTAPI
      # ======================================================

      - name: Start FastAPI backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app \
            --host 0.0.0.0 \
            --port 8001 \
            > ../backend.log 2>&1 &

          echo $! > ../backend.pid

          echo "FastAPI process started."

      - name: Wait for FastAPI
        run: |
          echo "Waiting for FastAPI..."

          for i in {1..60}; do
            if curl --silent \
              --fail \
              http://127.0.0.1:8001/docs \
              > /dev/null
            then
              echo "FastAPI is ready."
              exit 0
            fi

            sleep 2
          done

          echo "FastAPI failed to start."

          echo ""
          echo "========== BACKEND LOG =========="
          cat backend.log || true
          echo "================================="

          exit 1

      # ======================================================
      # NODE
      # ======================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ======================================================
      # FRONTEND
      # ======================================================

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Start Vite frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- \
            --host 0.0.0.0 \
            --port 5173 \
            > ../frontend.log 2>&1 &

          echo $! > ../frontend.pid

          echo "Vite process started."

      - name: Wait for Vite
        run: |
          echo "Waiting for Vite..."

          for i in {1..60}; do
            if curl --silent \
              --fail \
              http://127.0.0.1:5173 \
              > /dev/null
            then
              echo "Vite is ready."
              exit 0
            fi

            sleep 2
          done

          echo "Vite failed to start."

          echo ""
          echo "========== FRONTEND LOG =========="
          cat frontend.log || true
          echo "=================================="

          exit 1

      # ======================================================
      # PLAYWRIGHT
      # ======================================================

      - name: Install automation dependencies
        working-directory: automation
        run: |
          npm ci

      - name: Install Chromium
        working-directory: automation
        run: |
          npx playwright install --with-deps chromium

      # ======================================================
      # RUN REGRESSION
      # ======================================================

      - name: Run NEXORA Chromium regression
        working-directory: automation
        env:
          NEXORA_ADMIN_PASSWORD: ${{ secrets.NEXORA_ADMIN_PASSWORD }}
          CI: true
        run: |
          npx playwright test \
            --project=chromium \
            --workers=1

      # ======================================================
      # DEBUG LOGS
      # ======================================================

      - name: Print backend log on failure
        if: failure()
        run: |
          echo ""
          echo "=========================================="
          echo "FASTAPI BACKEND LOG"
          echo "=========================================="

          cat backend.log || true

      - name: Print frontend log on failure
        if: failure()
        run: |
          echo ""
          echo "=========================================="
          echo "VITE FRONTEND LOG"
          echo "=========================================="

          cat frontend.log || true

      # ======================================================
      # ARTIFACTS
      # ======================================================

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-playwright-report
          path: automation/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-playwright-test-results
          path: automation/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload application logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-application-logs
          path: |
            backend.log
            frontend.log
          if-no-files-found: ignore
          retention-days: 14