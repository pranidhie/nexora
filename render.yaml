databases:
  - name: nexora-db-pranidhie
    databaseName: nexora
    user: nexora
    plan: free

services:
  - type: web
    name: nexora-api-pranidhie
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python prepare_demo_database.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10

      - key: APP_NAME
        value: NEXORA

      - key: APP_ENV
        value: production

      - key: DEBUG
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db-pranidhie
          property: connectionString

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"

      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      - key: CORS_ORIGINS
        value: https://nexora-web-pranidhie.onrender.com

      - key: AI_PROVIDER
        value: gemini

      - key: AI_RATE_LIMIT_REQUESTS
        value: "5"

      - key: AI_RATE_LIMIT_WINDOW_SECONDS
        value: "60"

      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com

      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite

      - key: GEMINI_TIMEOUT_SECONDS
        value: "120"

      - key: GEMINI_API_KEY
        sync: false

      - key: NEXORA_ADMIN_EMAIL
        sync: false

      - key: NEXORA_ADMIN_PASSWORD
        sync: false

  - type: web
    name: nexora-web-pranidhie
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit

    envVars:
      - key: VITE_API_BASE_URL
        value: https://nexora-api-pranidhie.onrender.com